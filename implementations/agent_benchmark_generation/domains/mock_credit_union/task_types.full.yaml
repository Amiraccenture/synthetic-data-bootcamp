# Credit Card Agent — Task Types
# allow_write: true  → correct resolution changes the database
# allow_write: false → read-only; agent looks up or refuses, nothing is written

# ── COMMON REQUESTS ──────────────────────────────────────────────────────────

task_types:

  balance_inquiry:
    allow_write: false
    description: Customer asks for current balance, available credit, or next due date

  payment_due_inquiry:
    allow_write: false
    description: Customer asks for minimum payment amount or payment due date

  transaction_history:
    allow_write: false
    description: Customer asks to review recent transactions on their statement

  fee_waiver:
    allow_write: true
    description: Customer requests removal of a late payment or returned payment fee

  transaction_dispute:
    allow_write: true
    description: Customer disputes an unrecognized or incorrect charge within 60 days

  address_update:
    allow_write: true
    description: Customer requests a change to their billing address on file

  lost_card_report:
    allow_write: true
    description: Customer reports their card lost or stolen; account is flagged and replacement issued

  authorized_user_add:
    allow_write: true
    description: Primary cardholder requests adding a new authorized user to the account

  payment_holiday_enrollment:
    allow_write: true
    description: Customer opts in to skip a minimum payment during an eligible month

  vau_opt_out:
    allow_write: true
    description: Customer requests to be removed from the Visa Account Updater service

# ── EDGE CASES ────────────────────────────────────────────────────────────────

  refuse_dispute:
    allow_write: false
    description: Agent rejects dispute because transaction is older than 60 days from statement date

  refuse_fee_waiver:
    allow_write: false
    description: Agent rejects fee waiver because one was already applied in the past 12 months

  credit_limit_increase:
    allow_write: true
    description: Customer requests a higher credit limit; requires credit review and supervisor approval

  authorized_user_remove:
    allow_write: true
    description: Primary cardholder requests removal of an authorized user; may require account closure

  stop_payment_check:
    allow_write: true
    description: Customer requests a stop payment on a convenience check; fee applies

  fraud_escalation:
    allow_write: true
    description: Suspected fraud confirmed during interaction; account flagged and escalated to fraud team

  unauthorized_use_dispute:
    allow_write: true
    description: Customer reports specific charges made after card was lost or stolen

  refuse_payment_holiday:
    allow_write: false
    description: Agent rejects payment holiday because account has a past-due balance on any DCCU loan

  account_closure_request:
    allow_write: true
    description: Customer requests to close their account; balance obligation remains; requires escalation
