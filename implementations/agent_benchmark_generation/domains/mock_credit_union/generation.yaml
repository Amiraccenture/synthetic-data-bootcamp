# =============================================================================
# Credit-union generation config
# =============================================================================
# The sampler draws one customer per task from `case_index` (a generation-only
# table that no tool reads, so it cannot leak answers to the agent), then shows
# the generator that customer's verification details and pre-computed lists of
# disputable / stale transactions and waivable / blocked fees.
#
# NOTE: the generation prompt includes only the first 1,500 characters of
# policy.md. The policy's dispute and fee rules are therefore NOT visible to the
# generator; these eligibility filters, the entity lists, and the task-type
# descriptions in task_types.yaml carry those rules instead.
# =============================================================================

agent_role: "credit card customer service agent"

primary_collection: case_index
id_field: customer_id

related:
  customer_id:
    collection: customers
    via: customer_id
    fields: [name]

# What the generator sees about the sampled customer. Includes everything the
# oracle needs: verify_identity arguments and the ids to act on.
context_fields:
  - customer_id
  - account_last4
  - date_of_birth
  - ssn_last4
  - current_balance
  - active_cards
  - disputable_transactions
  - stale_transactions
  - waivable_fees
  - blocked_fees

persona_related: customer_id
persona_field: name

# Keep generated oracles valid by construction. Types not listed here (balance,
# lost card, fraud) can use any customer.
eligibility:
  transaction_dispute:
    has_disputable_txn: [true]
  refuse_dispute:
    has_stale_txn: [true]
  fee_waiver:
    has_waivable_fee: [true]
  refuse_fee_waiver:
    has_blocked_fee: [true]
  lost_card_report:
    has_active_card: [true]
  fraud_escalation:
    has_active_card: [true]

communicate_hints:
  balance_inquiry: >
    Include the exact current_balance as plain digits with a decimal point and
    no $ sign or thousands separator, e.g. ["412.37"].
  transaction_dispute: >
    Policy requires the agent to state both timelines: ["30 days", "90 days"].
  refuse_dispute: >
    The agent must cite the 60-day dispute window: ["60 days"].
  fee_waiver: 'The agent confirms the fee was waived: ["waived"].'
  refuse_fee_waiver: >
    Late payment fee blocked by a prior waiver: ["12 months"]. Returned payment
    fee blocked by a prior waiver this year: ["calendar year"].
  lost_card_report: >
    The agent confirms a replacement card and zero liability after the report:
    ["replacement", "$0"].
  fraud_escalation: >
    The agent confirms a human agent will follow up: ["human agent"].
